# ---- 安全加固：安全响应头 ----
<IfModule mod_headers.c>
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set X-XSS-Protection "1; mode=block"
</IfModule>

# ---- 安全加固：阻断敏感文件 ----
<FilesMatch "^(readme\.html|readme\.txt|license\.txt|wp-config-sample\.php|wp-config\.php|install\.php|xmlrpc\.php|wp-config\.bak)$">
	Require all denied
</FilesMatch>

# ---- 安全加固：阻断插件/主题版本信息文件 ----
<LocationMatch "^/wp-content/(plugins|themes)/[^/]+/readme\.(txt|html)$">
	Require all denied
</LocationMatch>

# ---- 安全加固：数据库目录不可通过 URL 访问 ----
<LocationMatch "^/wp-content/database/">
	Require all denied
</LocationMatch>

# ---- 安全加固：隐藏服务器版本 ----
ServerTokens Prod
ServerSignature Off

# ---- 安全加固：禁用网页后台访问（仅保留容器内 WP-CLI 管理） ----
<LocationMatch "^/wp-login\.php">
	Require all denied
</LocationMatch>
# 阻止访问后台入口，但保留其下的 css/js 等静态资源目录（便于日后恢复）
<LocationMatch "^/wp-admin/?$">
	Require all denied
</LocationMatch>
<LocationMatch "^/wp-admin/(index\.php|admin\.php|user\.php|profile\.php|import\.php|export\.php)$">
	Require all denied
</LocationMatch>
<LocationMatch "^/wp-admin/network/?$">
	Require all denied
</LocationMatch>
